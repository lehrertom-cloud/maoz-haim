var MH_URL = 'https://script.google.com/macros/s/AKfycbwILFwTYPqVd_PKCjD6FKGEobTF8pW2pPXOMgcPgUPrwcn77LoeZiAnE4sxZAd0skSFzw/exec';
var UI_KEY = 'mh_ui';
function show(html) {
  var inject = '<head><script>window.MH_API = ' + JSON.stringify(MH_URL) + ';<\/script>';
  document.open();
  document.write(html.replace('<head>', inject));
  document.close();
}
function getCached() { try { return localStorage.getItem(UI_KEY); } catch (e) { return null; } }
function setCached(h) { try { localStorage.setItem(UI_KEY, h); } catch (e) {} }
