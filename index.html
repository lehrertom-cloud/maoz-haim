<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מעוז חיים · תקלות ומשימות</title>
</head>
<body style="font-family:system-ui,Arial,sans-serif;background:#f6f8f5;margin:0">
<div id="ld" style="text-align:center;margin-top:40vh;color:#555">טוען את האפליקציה…</div>
<script>
// המסכים נטענים מגוגל, והנתונים נשמרים רק בגיליון של מעוז חיים.
// כל פעולה נבדקת בשרת מול הקוד האישי. בקובץ הזה אין נתונים ואין קודים.
var MH_API = 'https://script.google.com/macros/s/AKfycbwILFwTYPqVd_PKCjD6FKGEobTF8pW2pPXOMgcPgUPrwcn77LoeZiAnE4sxZAd0skSFzw/exec';
function start() {
  document.getElementById('ld').textContent = 'טוען את האפליקציה…';
  fetch(MH_API + '?ui=1')
    .then(function (r) { if (!r.ok) throw new Error('שגיאה ' + r.status); return r.text(); })
    .then(function (html) {
      var inject = '<head><script>window.MH_API = ' + JSON.stringify(MH_API) + ';<\/script>';
      document.open();
      document.write(html.replace('<head>', inject));
      document.close();
    })
    .catch(function (e) {
      document.getElementById('ld').innerHTML = 'לא הצלחתי לטעון את האפליקציה (' + e.message + ').<br><br><button onclick="start()" style="font-size:16px;padding:10px 20px">נסה שוב</button>';
    });
}
start();
</script>
</body>
</html>
